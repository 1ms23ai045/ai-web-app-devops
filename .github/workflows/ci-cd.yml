
name: AI Web App CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: pytest -v

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to EC2 using SSM
        if: github.event_name == 'push'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-045aa839499a8322b \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo docker pull ghcr.io/1ms23ai045/ai-web-app-devops:latest",
              "sudo docker stop ai-web-app || true",
              "sudo docker rm ai-web-app || true",
              "sudo docker run -d --name ai-web-app -p 5000:5000 --restart unless-stopped ghcr.io/1ms23ai045/ai-web-app-devops:latest",
              "sleep 10",
              "curl --retry 5 --retry-delay 3 --retry-connrefused -f http://localhost:5000/health"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-045aa839499a8322b

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-045aa839499a8322b \
            --query "StandardOutputContent" \
            --output text